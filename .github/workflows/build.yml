name: Build & Package Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate Gradle Wrapper (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar not found, generating..."
            gradle wrapper --gradle-version 8.4
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Michel-PRO-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Comment on APK location
        run: |
          echo "✅ APK generado exitosamente"
          echo "📦 Descarga el APK desde: Actions → Build & Package Debug APK → Artifacts"
          ls -lh app/build/outputs/apk/debug/
